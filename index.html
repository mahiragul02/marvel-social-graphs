<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marvel Social Graphs</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(90, 50, 180, 0.18), transparent 30%),
                radial-gradient(circle at 80% 30%, rgba(220, 20, 60, 0.12), transparent 30%),
                #070711;
            color: #f5f5f5;
            overflow-x: hidden;
        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px 6%;

            background: rgba(7, 7, 17, 0.82);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            color: white;
        }

        .logo span {
            color: #ff304f;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ff304f;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 120px 20px 80px;

            position: relative;
            overflow: hidden;
        }

        /* Animated circles */

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.25;
            animation: float 8s ease-in-out infinite;
        }

        .orb.one {
            width: 300px;
            height: 300px;
            background: #6c35ff;
            top: 15%;
            left: -100px;
        }

        .orb.two {
            width: 250px;
            height: 250px;
            background: #ff1744;
            bottom: 5%;
            right: -80px;
            animation-delay: 2s;
        }

        .orb.three {
            width: 120px;
            height: 120px;
            background: #00d9ff;
            top: 25%;
            right: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-35px);
            }
        }

        .hero-content {
            max-width: 900px;
            position: relative;
            z-index: 2;
        }

        .badge {
            display: inline-block;

            padding: 8px 18px;
            border-radius: 30px;

            background: rgba(255,48,79,0.12);
            border: 1px solid rgba(255,48,79,0.4);

            color: #ff536c;

            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;

            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: clamp(50px, 8vw, 100px);
            font-weight: 900;

            line-height: 0.95;

            letter-spacing: -4px;

            margin-bottom: 25px;

            text-transform: uppercase;

            background: linear-gradient(
                90deg,
                #ffffff,
                #ff3655,
                #a86cff,
                #ffffff
            );

            background-size: 300%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: gradientMove 6s ease infinite;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0%;
            }

            50% {
                background-position: 100%;
            }

            100% {
                background-position: 0%;
            }
        }

        .hero p {
            font-size: 20px;
            color: #aaa;
            max-width: 650px;
            margin: auto;
            line-height: 1.7;
        }

        .hero-buttons {
            margin-top: 35px;

            display: flex;
            justify-content: center;
            gap: 15px;

            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;

            padding: 15px 28px;

            border-radius: 10px;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }

        .btn-primary {
            background: #ff304f;
            color: white;

            box-shadow:
                0 0 25px rgba(255,48,79,0.35);
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow:
                0 0 40px rgba(255,48,79,0.6);
        }

        .btn-secondary {
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            background: rgba(255,255,255,0.05);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-4px);
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            max-width: 1000px;

            margin: -70px auto 100px;

            padding: 30px;

            position: relative;
            z-index: 10;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;

            background: rgba(255,255,255,0.04);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 20px;

            backdrop-filter: blur(15px);
        }

        .stat {
            text-align: center;
            padding: 20px;
        }

        .stat-number {
            font-size: 35px;
            font-weight: 900;

            color: #ff405c;

            margin-bottom: 7px;
        }

        .stat-label {
            font-size: 13px;
            color: #999;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1100px;
            margin: auto;
            padding: 0 25px 100px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title small {
            color: #ff405c;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
        }

        .section-title h2 {
            font-size: 42px;
            margin-top: 10px;
        }

        .section-title p {
            color: #888;
            margin-top: 12px;
        }

        /* =========================
           ABOUT
        ========================= */

        .about {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 25px;

            margin-bottom: 110px;
